name: Enviar Relatorio CargoOps

on:
  schedule:
    # 8h30 Brasília = 11:30 UTC
   - cron: '30 11 * * *'
  workflow_dispatch: # Permite rodar manualmente para testar

jobs:
  report:
    runs-runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install puppeteer resend

      - name: Executar script de envio
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node send_report.js
